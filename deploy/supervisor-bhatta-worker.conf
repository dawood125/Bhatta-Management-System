; Queue worker for Bhatta Manager: sends invoice emails (docs/07-deployment.md, step 8).
; Copy to /etc/supervisor/conf.d/bhatta-worker.conf, then:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status

[program:bhatta-worker]
command=/usr/bin/php /var/www/bhatta/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/bhatta
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/bhatta/storage/logs/worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

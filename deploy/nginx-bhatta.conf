# Nginx site for Bhatta Manager (docs/07-deployment.md, step 7).
# Copy to /etc/nginx/sites-available/bhatta, replace bhatta.example.com with your address,
# link it into sites-enabled, then run certbot to add HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name bhatta.example.com;

    root /var/www/bhatta/public;
    index index.php;
    charset utf-8;

    # Logo uploads are at most 1 MB; leave room for the form around them.
    client_max_body_size 8M;

    # Hide the server version.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Built CSS/JS have a hash in their name: cache them for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # PDFs and backups can take a while.
        fastcgi_read_timeout 300;
    }

    # Never serve hidden files (.env, .git) except Let's Encrypt's checks.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
